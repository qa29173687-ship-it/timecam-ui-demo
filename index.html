<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="時間相機介面示範：大時間浮水印、範本、設定與自動上傳選項（不會真正拍照或上傳）">
  <title>時間相機 介面 DEMO</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="desk-only intro">
      <p class="eyebrow">時間相機 · 介面示範</p>
      <h1>把相機畫面改成這樣</h1>
      <p>這是可點的示範頁，不是已安裝的 App。時間會自己走，按鈕都可以按。用手機打開最準。資料不會上傳，也不會真的連結 Google。</p>
    </header>

    <div class="bezel" id="bezel">
      <div class="phone" id="app">
        <!-- CAMERA -->
        <section class="screen screen-camera is-on" id="screen-camera" aria-label="相機">
          <div class="status light" id="status-cam">
            <span class="st-time" data-clock="hm">10:14</span>
            <span class="st-right">
              <span class="sig" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
              <svg class="ico-wifi" viewBox="0 0 22 16" aria-hidden="true"><path d="M1.5 6.2C5.6 2.6 10.8 1.2 16.2 3.2M4.2 9C7.1 6.5 10.7 5.6 14.4 7M7.2 11.8c1.7-1.5 3.8-2 5.9-1.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="11" cy="14.2" r="1.3" fill="currentColor"/></svg>
              <span class="bat" aria-hidden="true"><b></b></span>
            </span>
          </div>

          <header class="topbar">
            <button class="tb-icon" id="btn-menu" aria-label="選單">
              <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
            <button class="tb-icon" id="btn-flash" aria-label="閃光燈" data-state="off">
              <!-- filled by JS -->
            </button>
            <button class="tb-pill" id="btn-wm-entry" aria-label="浮水印設定">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l7.2 3v6.1c0 4.4-3 7.5-7.2 8.7-4.2-1.2-7.2-4.3-7.2-8.7V6.2L12 3.2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.6 12.1l2.2 2.2 4.6-4.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>浮水印</span>
            </button>
            <span class="tb-spacer"></span>
            <button class="tb-icon" id="btn-flip" aria-label="切換前後鏡頭">
              <svg viewBox="0 0 24 24"><path d="M7 7.5A7 7 0 0 1 19 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M17 16.5A7 7 0 0 1 5 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16.2 4.8v4.2H20M7.8 19.2v-4.2H4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </header>

          <div class="preview" id="preview">
            <div class="preview-scene" id="preview-scene">
              <img src="assets/preview.jpg" alt="" id="preview-img" draggable="false">
            </div>
            <div class="flash-fx" id="flash-fx"></div>

            <div class="rec-badge" id="rec-badge" hidden><i></i><span id="rec-time">00:00</span></div>

            <div class="watermark" id="watermark" data-tpl="0"></div>

            <div class="zoom-stack" id="zoom-stack" role="radiogroup" aria-label="焦距">
              <button class="zoom-btn" data-zoom="0.5" aria-label="0.5 倍">0.5</button>
              <button class="zoom-btn on" data-zoom="1" aria-label="1 倍">1×</button>
              <button class="zoom-btn" data-zoom="2" aria-label="2 倍">2</button>
              <button class="zoom-btn" data-zoom="10" aria-label="10 倍">10</button>
            </div>

            <div class="float-btns">
              <button class="float-btn" id="btn-edit" aria-label="編輯浮水印">
                <svg viewBox="0 0 24 24"><path d="M14.2 5.2l4.6 4.6M4 20l.8-4.7L15.4 5.7a1.6 1.6 0 0 1 2.3 0l.7.7a1.6 1.6 0 0 1 0 2.3L7.7 19.2 4 20z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="float-btn" id="btn-pin" aria-label="定位">
                <svg viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-11.2A7 7 0 0 0 5 9.8C5 14.9 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="9.8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
              </button>
            </div>
          </div>

          <footer class="bottom">
            <div class="shutter-row">
              <button class="side-btn" id="btn-gallery" aria-label="本機照片">
                <span class="thumb" id="last-thumb"><span class="thumb-ph"></span></span>
                <span class="side-label">本機照片</span>
              </button>
              <button class="shutter" id="btn-shutter" aria-label="快門">
                <span class="shutter-ring"></span>
                <span class="shutter-core" id="shutter-core"></span>
              </button>
              <button class="side-btn" id="btn-tpl" aria-label="浮水印範本">
                <span class="tpl-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 15.5l2.3-2.8 1.8 2.1 2.6-3.3 3.3 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.2" cy="8.6" r="1.2" fill="currentColor"/></svg>
                </span>
                <span class="side-label">範本</span>
              </button>
            </div>
            <div class="modes" role="tablist" aria-label="拍攝模式">
              <button class="mode on" id="mode-photo" role="tab" aria-selected="true">照片<span class="dot"></span></button>
              <button class="mode" id="mode-video" role="tab" aria-selected="false">影片<span class="dot"></span></button>
            </div>
            <div class="home-ind" aria-hidden="true"></div>
          </footer>
        </section>

        <!-- SETTINGS -->
        <section class="screen screen-push" id="screen-settings" aria-label="設定">
          <div class="status light">
            <span class="st-time" data-clock="hm">10:14</span>
            <span class="st-right">
              <span class="sig"><i></i><i></i><i></i><i></i></span>
              <svg class="ico-wifi" viewBox="0 0 22 16"><path d="M1.5 6.2C5.6 2.6 10.8 1.2 16.2 3.2M4.2 9C7.1 6.5 10.7 5.6 14.4 7M7.2 11.8c1.7-1.5 3.8-2 5.9-1.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="11" cy="14.2" r="1.3" fill="currentColor"/></svg>
              <span class="bat"><b></b></span>
            </span>
          </div>
          <header class="page-bar">
            <button class="tb-icon" id="btn-settings-back" aria-label="返回">
              <svg viewBox="0 0 24 24"><path d="M15.2 5.2L8.5 12l6.7 6.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <h2>設定</h2>
            <span class="tb-icon" style="visibility:hidden"></span>
          </header>
          <div class="settings-body" id="settings-body"></div>
          <div class="home-ind dark" aria-hidden="true"></div>
        </section>

        <!-- GALLERY -->
        <section class="screen screen-push" id="screen-gallery" aria-label="本機照片">
          <div class="status light">
            <span class="st-time" data-clock="hm">10:14</span>
            <span class="st-right">
              <span class="sig"><i></i><i></i><i></i><i></i></span>
              <svg class="ico-wifi" viewBox="0 0 22 16"><path d="M1.5 6.2C5.6 2.6 10.8 1.2 16.2 3.2M4.2 9C7.1 6.5 10.7 5.6 14.4 7M7.2 11.8c1.7-1.5 3.8-2 5.9-1.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="11" cy="14.2" r="1.3" fill="currentColor"/></svg>
              <span class="bat"><b></b></span>
            </span>
          </div>
          <header class="page-bar">
            <button class="tb-icon" id="btn-gallery-back" aria-label="返回">
              <svg viewBox="0 0 24 24"><path d="M15.2 5.2L8.5 12l6.7 6.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <h2>本機照片</h2>
            <span class="tb-icon" style="visibility:hidden"></span>
          </header>
          <div class="gallery-body" id="gallery-body"></div>
          <div class="home-ind dark" aria-hidden="true"></div>
        </section>

        <!-- overlays -->
        <div class="scrim" id="scrim" hidden></div>
        <aside class="drawer" id="drawer" aria-hidden="true"></aside>
        <div class="sheet" id="sheet" hidden></div>
        <div class="toast" id="toast" hidden></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
